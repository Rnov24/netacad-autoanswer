<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NetAcad AI Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #2563eb;
      --blue-h: #1d4ed8;
      --cyan: #38bdf8;
      --green: #10b981;
      --purple: #8b5cf6;
      --purple-h: #7c3aed;
      --amber: #d97706;
      --red: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body { width: 340px; padding: 16px; background: var(--bg); color: var(--text); }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .header h3 { font-size: 16px; font-weight: 700; color: var(--cyan); }
    .badge {
      font-size: 10px; padding: 2px 6px; border-radius: 99px;
      background: rgba(56,189,248,.15); color: var(--cyan); border: 1px solid rgba(56,189,248,.3);
    }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    input[type="password"], select {
      width: 100%; padding: 7px 10px; font-size: 13px;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; outline: none;
      transition: border-color .15s;
    }
    input[type="password"]:focus, select:focus { border-color: var(--cyan); }

    .card {
      background: rgba(30,41,59,.5); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; margin-bottom: 10px;
    }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
    .toggle-label { font-size: 12px; color: var(--text); }

    .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #475569; transition: .2s; border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px;
      left: 2px; bottom: 2px; background: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background: var(--blue); }
    input:checked + .slider:before { transform: translateX(16px); }

    .btn-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
    .btn-row { display: flex; gap: 7px; }

    .btn {
      flex: 1; padding: 9px; font-size: 12px; font-weight: 700;
      border: none; border-radius: 6px; cursor: pointer;
      transition: filter .15s, transform .1s; text-align: center;
    }
    .btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn:active { filter: brightness(.95); transform: translateY(0); }

    .btn-quiz  { background: var(--blue);   color: #fff; }
    .btn-scroll{ background: var(--purple); color: #fff; }
    .btn-pause { background: var(--amber);  color: #fff; flex: 0 0 auto; width: 90px; }
    .btn-stop  { background: var(--red);    color: #fff; flex: 0 0 auto; width: 68px; }
    .btn-save  { background: var(--card);   color: var(--muted); border: 1px solid var(--border); }

    #status {
      margin-top: 8px; text-align: center; font-size: 12px;
      min-height: 16px; color: var(--cyan); transition: color .2s;
    }

    .hint { margin-top: 8px; text-align: center; font-size: 11px; color: var(--muted); }
    .hint b { color: var(--text); }
  </style>
</head>
<body>
  <div class="header">
    <h3>NetAcad AI <span class="badge">v2.0</span></h3>
  </div>

  <div class="form-group">
    <label for="aiProvider">AI Provider</label>
    <select id="aiProvider">
      <option value="gemini">Google Gemini</option>
      <option value="groq">Groq (Ultra-Fast)</option>
      <option value="openai">OpenAI (ChatGPT)</option>
      <option value="anthropic">Claude (Anthropic)</option>
      <option value="openrouter">OpenRouter (Multi-Model)</option>
    </select>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="apiKey" id="apiKeyLabel">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter API Key">
    </div>
    <div class="form-group">
      <label for="modelSelect">Model</label>
      <select id="modelSelect"></select>
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span class="toggle-label" style="color:#38bdf8;font-weight:600;">Auto-Select Answers</span>
      <label class="switch"><input type="checkbox" id="autoSelectToggle" checked><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label" style="color:#10b981;font-weight:600;">Auto-Submit Answers</span>
      <label class="switch"><input type="checkbox" id="autoSubmitToggle"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Show AI Answer Cards</span>
      <label class="switch"><input type="checkbox" id="showAnswersToggle" checked><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Process on Page Switch</span>
      <label class="switch"><input type="checkbox" id="processOnSwitchToggle" checked><span class="slider"></span></label>
    </div>
  </div>

  <div class="btn-group">
    <!-- Primary action buttons -->
    <button class="btn btn-quiz"   id="processPage">Auto-Solve Quiz 🚀</button>
    <button class="btn btn-scroll" id="autoScrollBtn">Auto-Scroll &amp; Complete Module 📜</button>

    <!-- Control row -->
    <div class="btn-row">
      <button class="btn btn-pause" id="pauseBtn">Pause ⏸️</button>
      <button class="btn btn-stop"  id="stopBtn">Stop ⏹️</button>
      <button class="btn btn-save"  id="saveKey" style="flex:1;">Save Settings</button>
    </div>
  </div>

  <div id="status"></div>
  <div class="hint">Shortcut: <b>Alt+Shift+Q</b> — Auto-Solve Quiz</div>

  <script src="popup.js"></script>
</body>
</html>
